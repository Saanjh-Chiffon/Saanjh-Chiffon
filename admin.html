<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Saanjh Admin Panel</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f7f1eb;
      margin:0;
      padding:20px;
      color:#333;
    }

    .box{
      max-width:900px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 5px 20px #0001;
    }

    h1{
      color:#8b5e3c;
    }

    input,button{
      width:100%;
      padding:12px;
      margin:7px 0;
      box-sizing:border-box;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button{
      background:#8b5e3c;
      color:white;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      opacity:.9;
    }

    .product{
      border:1px solid #ddd;
      padding:15px;
      margin:12px 0;
      border-radius:10px;
    }

    .stock{
      font-weight:bold;
      color:#8b5e3c;
    }

    #adminPanel{
      display:none;
    }

    .logout{
      background:#555;
    }
  
    #editProductOverlay label{
      display:block;
      margin:12px 0 5px;
      font-weight:700;
      color:#5d4a43;
    }
    #editProductOverlay input,
    #editProductOverlay textarea{
      width:100%;
      padding:12px;
      box-sizing:border-box;
      border:1px solid #ccc;
      border-radius:8px;
      font:inherit;
      background:#fff;
    }
    #editProductOverlay button{
      width:100%;
    }
    @media(max-width:600px){
      #editProductOverlay{padding:10px!important}
      #editProductOverlay > div{padding:18px!important}
    }
</style>
</head>

<body>

<div class="box">

  <h1>🌸 Saanjh Admin Panel</h1>

  <!-- LOGIN -->
  <div id="loginBox">

    <h3>Admin Login</h3>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <button class="logout" onclick="logout()">
      Logout
    </button>

    <hr>

    <h2>Add Product</h2>

    <input
      id="productName"
      placeholder="Product Name"
    >

    <input
      id="productPrice"
      type="number"
      placeholder="Price"
    >

    <input
      id="productStock"
      type="number"
      placeholder="Stock Quantity"
    >

    <textarea id="productDescription" placeholder="Description" rows="3"></textarea>
    <input id="productColor" placeholder="Color">
    <input id="productWork" placeholder="Border / Work">
    <input id="productOccasion" placeholder="Occasion">
    <input id="productSareeLength" placeholder="Saree Length (e.g. Approx. 5.5 m)">
    <input id="productBlouseDetails" placeholder="Blouse Details">
    <input id="productFabric" placeholder="Fabric" value="Chiffon">

    <input
  id="productImage"
  type="file"
  accept="image/*"
  multiple
>

    <button onclick="addProduct()">
      Add Product
    </button>

    <hr>

    <h2>Products</h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</div>



<!-- FULL PRODUCT EDIT PANEL -->
<div id="editProductOverlay" style="
  display:none;position:fixed;inset:0;background:rgba(20,14,12,.58);
  z-index:9999;align-items:center;justify-content:center;padding:18px;
">
  <div style="
    width:min(900px,96vw);max-height:94vh;overflow:auto;background:#fff;
    border-radius:18px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.25);
  ">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <h2 style="margin:0;color:#5d4a43;">Edit Product</h2>
      <button type="button" onclick="closeEditPanel()" style="
        width:44px;padding:10px;margin:0;background:#fff;color:#333;
        border:1px solid #ddd;font-size:22px;
      ">×</button>
    </div>

    <p id="editProductStatus" style="color:#8b5e3c;margin:10px 0 18px;"></p>

    <input type="hidden" id="editProductId">

    <label>Product Name</label>
    <input id="editProductName" placeholder="Product Name">

    <label>Price</label>
    <input id="editProductPrice" type="number" min="0" placeholder="Price">

    <label>Stock Quantity</label>
    <input id="editProductStock" type="number" min="0" placeholder="Stock Quantity">

    <label>Description</label>
    <textarea id="editProductDescription" rows="4" placeholder="Description"></textarea>

    <label>Color</label>
    <input id="editProductColor" placeholder="Color">

    <label>Border / Work</label>
    <input id="editProductWork" placeholder="Border / Work">

    <label>Occasion</label>
    <input id="editProductOccasion" placeholder="Occasion">

    <label>Saree Length</label>
    <input id="editProductSareeLength" placeholder="Approx. 5.5 m">

    <label>Blouse Details</label>
    <input id="editProductBlouseDetails" placeholder="Blouse Details">

    <label>Fabric</label>
    <input id="editProductFabric" placeholder="Fabric">

    <hr style="border:0;border-top:1px solid #eee;margin:22px 0;">

    <h3 style="margin:0 0 8px;color:#5d4a43;">Current Photos</h3>
    <div id="editCurrentPhotos" style="
      display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;
    "></div>

    <label style="font-weight:700;color:#5d4a43;">
      Replace Photos
    </label>
    <p style="font-size:13px;color:#777;margin:5px 0 8px;">
      New photos select karoge to purani photos replace ho jayengi. Multiple photos ek saath select kar sakte ho.
    </p>
    <input
      id="editProductImages"
      type="file"
      accept="image/*"
      multiple
      style="background:#fff;"
    >

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;">
      <button type="button" onclick="saveEditPanel()" id="saveEditPanelBtn">
        Save All Changes
      </button>
      <button type="button" onclick="closeEditPanel()" style="
        background:#fff;color:#333;border:1px solid #bbb;
      ">
        Cancel
      </button>
    </div>
  </div>
</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  setDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
  
  import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

  const firebaseConfig = {

    apiKey: "AIzaSyCUpRDeE2tKsBlpuK4sljUHjudwCjGwJsI",
    authDomain:
      "saanjhbysanskriti.firebaseapp.com",

    projectId:
      "saanjhbysanskriti",

    storageBucket:
      "saanjhbysanskriti.firebasestorage.app",

    messagingSenderId:
      "130853028955",

    appId:
      "1:130853028955:web:f95a16d3356d9710896b7e"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);
  
  const storage = getStorage(app);


  window.login = async function(){

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      message.innerText =
        "Login successful ✅";

    }catch(error){

      console.error(error);

      message.innerText =
        "Login failed ❌ " + error.message;

    }

  };


  window.logout = async function(){

    await signOut(auth);

  };


  onAuthStateChanged(auth, user => {

    if(user){

      document.getElementById("loginBox")
        .style.display = "none";

      document.getElementById("adminPanel")
        .style.display = "block";

      loadProducts();

    }else{

      document.getElementById("loginBox")
        .style.display = "block";

      document.getElementById("adminPanel")
        .style.display = "none";

    }

  });


  async function loadProducts(){

    const container =
      document.getElementById("products");

    container.innerHTML =
      "Loading products...";

    try{

      const snapshot =
        await getDocs(
          collection(db,"PRODUCTS")
        );

      container.innerHTML = "";

      snapshot.forEach(productDoc => {

        const product =
          productDoc.data();

        const id =
          productDoc.id;

        const div =
          document.createElement("div");

        div.className = "product";

        div.innerHTML = `

          <h3>${product.Name || "Product"}</h3>

          <p>
            Price: ₹${product.price || 0}
          </p>

          <p class="stock">
            Stock: ${product.stock || 0}
          </p>
          <p style="line-height:1.7;color:#6b5a55;">
            ${product.color ? "Color: " + product.color + "<br>" : ""}
            ${product.borderWork ? "Border / Work: " + product.borderWork + "<br>" : ""}
            ${product.occasion ? "Occasion: " + product.occasion + "<br>" : ""}
            ${product.sareeLength ? "Saree Length: " + product.sareeLength + "<br>" : ""}
            ${product.blouseDetails ? "Blouse: " + product.blouseDetails + "<br>" : ""}
            ${product.fabric ? "Fabric: " + product.fabric : ""}
          </p>
<div class="product-images">
  ${
    (product.images && product.images.length
      ? product.images
      : (product.image ? [product.image] : [])
    ).map(img => `
      <img
        src="${img}"
        style="width:120px;height:120px;object-fit:cover;margin:5px;border-radius:8px;"
      >
    `).join("")
  }
</div>
          <input
            type="number"
            id="stock-${id}"
            value="${product.stock || 0}"
            min="0"
          >

          <button
            onclick="updateStock('${id}')"
          >
            Update Stock
          </button>
          <br><br>

<button type="button" onclick="openEditPanel('${id}')">
    Edit Product — All Details & Photos
</button>
<button type="button" onclick="deleteProduct('${id}')" style="background:#b42318;margin-top:8px;">
    Delete Product
</button>

        `;

        container.appendChild(div);

      });

    }catch(error){

      console.error(error);

      container.innerHTML =
        "Products load nahi hue ❌";

    }

  }


  window.updateStock = async function(id){

    const input =
      document.getElementById("stock-" + id);

    const newStock =
      Number(input.value);

    try{

      await updateDoc(
        doc(db,"PRODUCTS",id),
        {
          stock:newStock
        }
      );

      alert("Stock updated ✅");

      loadProducts();

    }catch(error){

      console.error(error);

      alert(
        "Stock update nahi hua ❌\n\n" +
        error.message
      );

    }

  };
window.openEditPanel = async function(id){
  try{
    const snap = await getDoc(doc(db, "PRODUCTS", id));

    if(!snap.exists()){
      alert("Product nahi mila ❌");
      return;
    }

    const p = snap.data();

    document.getElementById("editProductId").value = id;
    document.getElementById("editProductName").value = p.Name || "";
    document.getElementById("editProductPrice").value = p.price ?? "";
    document.getElementById("editProductStock").value = p.stock ?? 0;
    document.getElementById("editProductDescription").value =
      p.description || p.Description || "";
    document.getElementById("editProductColor").value =
      p.color || p.Color || "";
    document.getElementById("editProductWork").value =
      p.borderWork || p.border || p.Border || "";
    document.getElementById("editProductOccasion").value =
      p.occasion || p.Occasion || "";
    document.getElementById("editProductSareeLength").value =
      p.sareeLength || p.length || p.Length || "";
    document.getElementById("editProductBlouseDetails").value =
      p.blouseDetails || p.blouse || p.Blouse || "";
    document.getElementById("editProductFabric").value =
      p.fabric || p.Fabric || "Chiffon";
    document.getElementById("editProductImages").value = "";

    const images = Array.isArray(p.images) && p.images.length
      ? p.images
      : (p.image ? [p.image] : []);

    const current = document.getElementById("editCurrentPhotos");
    current.innerHTML = images.length
      ? images.map((url, i) => `
          <div style="width:120px;">
            <img src="${url}" alt="Photo ${i+1}" style="
              width:120px;height:120px;object-fit:cover;border-radius:10px;
              border:1px solid #ddd;display:block;
            ">
            <small style="display:block;text-align:center;color:#777;margin-top:4px;">
              Photo ${i+1}
            </small>
          </div>
        `).join("")
      : '<p style="color:#777;">No photos found.</p>';

    document.getElementById("editProductStatus").textContent =
      "Sabhi product details ek hi panel me edit kar sakte ho.";

    document.getElementById("editProductOverlay").style.display = "flex";
    document.body.style.overflow = "hidden";
  }catch(error){
    console.error(error);
    alert("Edit panel open nahi hua ❌\n\n" + error.message);
  }
};

window.closeEditPanel = function(){
  document.getElementById("editProductOverlay").style.display = "none";
  document.body.style.overflow = "";
};

window.saveEditPanel = async function(){
  const id = document.getElementById("editProductId").value;
  const button = document.getElementById("saveEditPanelBtn");

  if(!id) return;

  const name = document.getElementById("editProductName").value.trim();
  const price = Number(document.getElementById("editProductPrice").value);
  const stock = Number(document.getElementById("editProductStock").value);
  const description = document.getElementById("editProductDescription").value.trim();
  const color = document.getElementById("editProductColor").value.trim();
  const work = document.getElementById("editProductWork").value.trim();
  const occasion = document.getElementById("editProductOccasion").value.trim();
  const sareeLength = document.getElementById("editProductSareeLength").value.trim();
  const blouseDetails = document.getElementById("editProductBlouseDetails").value.trim();
  const fabric = document.getElementById("editProductFabric").value.trim() || "Chiffon";
  const fileInput = document.getElementById("editProductImages");

  if(!name || !Number.isFinite(price) || price < 0 || !Number.isFinite(stock) || stock < 0){
    alert("Product name, price aur stock sahi fill karo.");
    return;
  }

  try{
    button.disabled = true;
    button.textContent = "Saving...";

    const productRef = doc(db, "PRODUCTS", id);
    const snap = await getDoc(productRef);

    if(!snap.exists()){
      throw new Error("Product nahi mila.");
    }

    const current = snap.data();
    let images = Array.isArray(current.images)
      ? [...current.images]
      : (current.image ? [current.image] : []);
    let image = current.image || images[0] || "";

    // If new photos are selected, replace the entire photo set.
    if(fileInput && fileInput.files.length > 0){
      images = [];

      const files = Array.from(fileInput.files);

      for(let i = 0; i < files.length; i++){
        const file = files[i];
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const storageRef = ref(
          storage,
          "products/" + id + "/" + Date.now() + "_" + i + "_" + safeName
        );

        await uploadBytes(storageRef, file);
        images.push(await getDownloadURL(storageRef));
      }

      image = images[0] || "";
    }

    await updateDoc(productRef, {
      Name: name,
      price: price,
      stock: stock,
      description: description,
      color: color,
      borderWork: work,
      occasion: occasion,
      sareeLength: sareeLength,
      blouseDetails: blouseDetails,
      fabric: fabric,
      image: image,
      images: images
    });

    alert("Product ki saari details successfully update ho gayi ✅");
    closeEditPanel();
    loadProducts();

  }catch(error){
    console.error(error);
    alert("Product update nahi hua ❌\n\n" + error.message);
  }finally{
    button.disabled = false;
    button.textContent = "Save All Changes";
  }
};

// Keep old function name compatible with any existing calls.
window.editProduct = window.openEditPanel;

  window.addProduct = async function(){

    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const stock = Number(document.getElementById("productStock").value);

    const description = document.getElementById("productDescription").value.trim();
    const color = document.getElementById("productColor").value.trim();
    const work = document.getElementById("productWork").value.trim();
    const occasion = document.getElementById("productOccasion").value.trim();
    const sareeLength = document.getElementById("productSareeLength").value.trim();
    const blouseDetails = document.getElementById("productBlouseDetails").value.trim();
    const fabric = document.getElementById("productFabric").value.trim() || "Chiffon";

    const imageFiles = document.getElementById("productImage").files;

    if(!name || !price || stock < 0){
      alert("Product details complete karo.");
      return;
    }

    try{

      let images = [];

      for (const file of imageFiles) {

        const imageRef = ref(
          storage,
          "products/" + Date.now() + "_" + file.name
        );

        await uploadBytes(imageRef, file);
        const imageUrl = await getDownloadURL(imageRef);
        images.push(imageUrl);
      }

      await addDoc(
        collection(db,"PRODUCTS"),
        {
          Name:name,
          price:price,
          stock:stock,
          description:description,
          color:color,
          borderWork:work,
          occasion:occasion,
          sareeLength:sareeLength,
          blouseDetails:blouseDetails,
          fabric:fabric,
          images:images,
          image:images[0] || ""
        }
      );

      alert("Product added successfully ✅");

      document.getElementById("productName").value = "";
      document.getElementById("productPrice").value = "";
      document.getElementById("productStock").value = "";
      document.getElementById("productDescription").value = "";
      document.getElementById("productColor").value = "";
      document.getElementById("productWork").value = "";
      document.getElementById("productOccasion").value = "";
      document.getElementById("productSareeLength").value = "";
      document.getElementById("productBlouseDetails").value = "";
      document.getElementById("productFabric").value = "Chiffon";
      document.getElementById("productImage").value = "";

      loadProducts();

    }catch(error){

      console.error(error);

      alert(
        "Product add nahi hua ❌\n\n" +
        error.message
      );

    }

  };

window.deleteProduct = async function(id){

  const confirmDelete = confirm(
    "Kya aap ye product delete karna chahte ho?"
  );

  if(!confirmDelete){
    return;
  }

  try{

    await deleteDoc(
      doc(db, "PRODUCTS", id)
    );

    alert("Product deleted successfully ✅");

    loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Product delete nahi hua ❌\n\n" +
      error.message
    );

  }

};

</script>

</body>
</html>
