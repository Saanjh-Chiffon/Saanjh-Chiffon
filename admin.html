<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Saanjh Admin Panel</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f7f1eb;
      margin:0;
      padding:20px;
      color:#333;
    }

    .box{
      max-width:900px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 5px 20px #0001;
    }

    h1{
      color:#8b5e3c;
    }

    input,button{
      width:100%;
      padding:12px;
      margin:7px 0;
      box-sizing:border-box;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button{
      background:#8b5e3c;
      color:white;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      opacity:.9;
    }

    .product{
      border:1px solid #ddd;
      padding:15px;
      margin:12px 0;
      border-radius:10px;
    }

    .stock{
      font-weight:bold;
      color:#8b5e3c;
    }

    #adminPanel{
      display:none;
    }

    .logout{
      background:#555;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🌸 Saanjh Admin Panel</h1>

  <!-- LOGIN -->
  <div id="loginBox">

    <h3>Admin Login</h3>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel">

    <button class="logout" onclick="logout()">
      Logout
    </button>

    <hr>

    <h2>Add Product</h2>

    <input
      id="productName"
      placeholder="Product Name"
    >

    <input
      id="productPrice"
      type="number"
      placeholder="Price"
    >

    <input
      id="productStock"
      type="number"
      placeholder="Stock Quantity"
    >

    <textarea id="productDescription" placeholder="Description" rows="3"></textarea>
    <input id="productColor" placeholder="Color">
    <input id="productWork" placeholder="Border / Work">
    <input id="productOccasion" placeholder="Occasion">
    <input id="productSareeLength" placeholder="Saree Length (e.g. Approx. 5.5 m)">
    <input id="productBlouseDetails" placeholder="Blouse Details">
    <input id="productFabric" placeholder="Fabric" value="Chiffon">

    <input
  id="productImage"
  type="file"
  accept="image/*"
  multiple
>

    <button onclick="addProduct()">
      Add Product
    </button>

    <hr>

    <h2>Products</h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  }
    from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  setDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
  
  import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

  const firebaseConfig = {

    apiKey: "AIzaSyCUpRDeE2tKsBlpuK4sljUHjudwCjGwJsI",
    authDomain:
      "saanjhbysanskriti.firebaseapp.com",

    projectId:
      "saanjhbysanskriti",

    storageBucket:
      "saanjhbysanskriti.firebasestorage.app",

    messagingSenderId:
      "130853028955",

    appId:
      "1:130853028955:web:f95a16d3356d9710896b7e"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);
  
  const storage = getStorage(app);


  window.login = async function(){

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      message.innerText =
        "Login successful ✅";

    }catch(error){

      console.error(error);

      message.innerText =
        "Login failed ❌ " + error.message;

    }

  };


  window.logout = async function(){

    await signOut(auth);

  };


  onAuthStateChanged(auth, user => {

    if(user){

      document.getElementById("loginBox")
        .style.display = "none";

      document.getElementById("adminPanel")
        .style.display = "block";

      loadProducts();

    }else{

      document.getElementById("loginBox")
        .style.display = "block";

      document.getElementById("adminPanel")
        .style.display = "none";

    }

  });


  async function loadProducts(){

    const container =
      document.getElementById("products");

    container.innerHTML =
      "Loading products...";

    try{

      const snapshot =
        await getDocs(
          collection(db,"PRODUCTS")
        );

      container.innerHTML = "";

      snapshot.forEach(productDoc => {

        const product =
          productDoc.data();

        const id =
          productDoc.id;

        const div =
          document.createElement("div");

        div.className = "product";

        div.innerHTML = `

          <h3>${product.Name || "Product"}</h3>

          <p>
            Price: ₹${product.price || 0}
          </p>

          <p class="stock">
            Stock: ${product.stock || 0}
          </p>
          <p style="line-height:1.7;color:#6b5a55;">
            ${product.color ? "Color: " + product.color + "<br>" : ""}
            ${product.borderWork ? "Border / Work: " + product.borderWork + "<br>" : ""}
            ${product.occasion ? "Occasion: " + product.occasion + "<br>" : ""}
            ${product.sareeLength ? "Saree Length: " + product.sareeLength + "<br>" : ""}
            ${product.blouseDetails ? "Blouse: " + product.blouseDetails + "<br>" : ""}
            ${product.fabric ? "Fabric: " + product.fabric : ""}
          </p>
<div class="product-images">
  ${
    (product.images && product.images.length
      ? product.images
      : (product.image ? [product.image] : [])
    ).map(img => `
      <img
        src="${img}"
        style="width:120px;height:120px;object-fit:cover;margin:5px;border-radius:8px;"
      >
    `).join("")
  }
</div>
          <input
            type="number"
            id="stock-${id}"
            value="${product.stock || 0}"
            min="0"
          >

          <button
            onclick="updateStock('${id}')"
          >
            Update Stock
          </button>
          <br><br>

<label style="display:block;margin:12px 0 6px;font-weight:700;color:#5d4a43;">
    Change / Replace Photos
</label>
<input
    type="file"
    id="productImage-${id}"
    accept="image/*"
    multiple
    style="background:#fff;"
>
<button type="button" onclick="editProduct('${id}')">
    Save Product Changes + Photos
</button>
<button type="button" onclick="deleteProduct('${id}')" style="background:#b42318;margin-top:8px;">
    Delete Product
</button>

        `;

        container.appendChild(div);

      });

    }catch(error){

      console.error(error);

      container.innerHTML =
        "Products load nahi hue ❌";

    }

  }


  window.updateStock = async function(id){

    const input =
      document.getElementById("stock-" + id);

    const newStock =
      Number(input.value);

    try{

      await updateDoc(
        doc(db,"PRODUCTS",id),
        {
          stock:newStock
        }
      );

      alert("Stock updated ✅");

      loadProducts();

    }catch(error){

      console.error(error);

      alert(
        "Stock update nahi hua ❌\n\n" +
        error.message
      );

    }

  };
window.editProduct = async function(id){

  try{

    const productRef = doc(db, "PRODUCTS", id);
    const productSnap = await getDoc(productRef);

    if(!productSnap.exists()){
      alert("Product nahi mila ❌");
      return;
    }

    const currentProduct = productSnap.data();

    const name = prompt("Product Name:", currentProduct.Name || "");
    if(name === null) return;

    const price = prompt("Price:", currentProduct.price || 0);
    if(price === null) return;

    const stock = prompt("Stock Quantity:", currentProduct.stock || 0);
    if(stock === null) return;

    const description = prompt("Description:",
      currentProduct.description || currentProduct.Description || "");
    if(description === null) return;

    const color = prompt("Color:",
      currentProduct.color || currentProduct.Color || "");
    if(color === null) return;

    const work = prompt("Border / Work:",
      currentProduct.borderWork || currentProduct.border || currentProduct.Border || "");
    if(work === null) return;

    const occasion = prompt("Occasion:",
      currentProduct.occasion || currentProduct.Occasion || "");
    if(occasion === null) return;

    const sareeLength = prompt("Saree Length:",
      currentProduct.sareeLength || currentProduct.length || currentProduct.Length || "Approx. 5.5 m");
    if(sareeLength === null) return;

    const blouseDetails = prompt("Blouse Details:",
      currentProduct.blouseDetails || currentProduct.blouse || currentProduct.Blouse || "");
    if(blouseDetails === null) return;

    const fabric = prompt("Fabric:",
      currentProduct.fabric || currentProduct.Fabric || "Chiffon");
    if(fabric === null) return;

    const fileInput = document.getElementById("productImage-" + id);

    let image = currentProduct.image || "";
    let images = Array.isArray(currentProduct.images)
      ? [...currentProduct.images]
      : (currentProduct.image ? [currentProduct.image] : []);

    if(fileInput && fileInput.files.length > 0){

      const files = Array.from(fileInput.files);
      images = [];

      for(const file of files){

        const storageRef = ref(
          storage,
          "products/" + id + "_" + Date.now() + "_" + file.name
        );

        await uploadBytes(storageRef, file);
        const imageUrl = await getDownloadURL(storageRef);
        images.push(imageUrl);
      }

      image = images[0] || "";
    }

    await updateDoc(productRef, {
      Name: name,
      price: Number(price),
      stock: Number(stock),
      description: description,
      color: color,
      borderWork: work,
      occasion: occasion,
      sareeLength: sareeLength,
      blouseDetails: blouseDetails,
      fabric: fabric || "Chiffon",
      image: image,
      images: images
    });

    if(fileInput) fileInput.value = "";

    alert("Product updated successfully ✅");
    loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Product update nahi hua ❌\n\n" +
      error.message
    );

  }

};

  window.addProduct = async function(){

    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const stock = Number(document.getElementById("productStock").value);

    const description = document.getElementById("productDescription").value.trim();
    const color = document.getElementById("productColor").value.trim();
    const work = document.getElementById("productWork").value.trim();
    const occasion = document.getElementById("productOccasion").value.trim();
    const sareeLength = document.getElementById("productSareeLength").value.trim();
    const blouseDetails = document.getElementById("productBlouseDetails").value.trim();
    const fabric = document.getElementById("productFabric").value.trim() || "Chiffon";

    const imageFiles = document.getElementById("productImage").files;

    if(!name || !price || stock < 0){
      alert("Product details complete karo.");
      return;
    }

    try{

      let images = [];

      for (const file of imageFiles) {

        const imageRef = ref(
          storage,
          "products/" + Date.now() + "_" + file.name
        );

        await uploadBytes(imageRef, file);
        const imageUrl = await getDownloadURL(imageRef);
        images.push(imageUrl);
      }

      await addDoc(
        collection(db,"PRODUCTS"),
        {
          Name:name,
          price:price,
          stock:stock,
          description:description,
          color:color,
          borderWork:work,
          occasion:occasion,
          sareeLength:sareeLength,
          blouseDetails:blouseDetails,
          fabric:fabric,
          images:images,
          image:images[0] || ""
        }
      );

      alert("Product added successfully ✅");

      document.getElementById("productName").value = "";
      document.getElementById("productPrice").value = "";
      document.getElementById("productStock").value = "";
      document.getElementById("productDescription").value = "";
      document.getElementById("productColor").value = "";
      document.getElementById("productWork").value = "";
      document.getElementById("productOccasion").value = "";
      document.getElementById("productSareeLength").value = "";
      document.getElementById("productBlouseDetails").value = "";
      document.getElementById("productFabric").value = "Chiffon";
      document.getElementById("productImage").value = "";

      loadProducts();

    }catch(error){

      console.error(error);

      alert(
        "Product add nahi hua ❌\n\n" +
        error.message
      );

    }

  };

window.deleteProduct = async function(id){

  const confirmDelete = confirm(
    "Kya aap ye product delete karna chahte ho?"
  );

  if(!confirmDelete){
    return;
  }

  try{

    await deleteDoc(
      doc(db, "PRODUCTS", id)
    );

    alert("Product deleted successfully ✅");

    loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "Product delete nahi hua ❌\n\n" +
      error.message
    );

  }

};

</script>

</body>
</html>
